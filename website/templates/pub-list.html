$for(pubs)$
<article>
  <p>
    <strong> <a href="$url$">$title$</a> </strong>
    <br />
    <strong> $authors$ </strong>
    <br />
    $venue$ ($year$) $if(comment)$
    <br />
    $comment$ $endif$
  </p>
  <div role="group" style="width: 15%">
    $if(pdf)$ <a role="button" class="primary" href="$pdf$">PDF</a> $endif$
    $if(cite)$ <a role="button" class="secondary" href="$cite$">CITE</a> $endif$
  </div>
</article>
$endfor$
